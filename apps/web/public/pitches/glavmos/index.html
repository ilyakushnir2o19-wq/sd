<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ГЛАВМОС</title>
<style>
:root{--bg:#050505;--s:#141414;--line:#292929;--text:#f5f5f3;--muted:#8c8c88;--a:#39b56a}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{display:flex;justify-content:center}
.phone{width:430px;height:932px;background:var(--bg);overflow:hidden;position:relative}
.appbar{height:78px;padding:24px 20px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #151515}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:750;letter-spacing:.02em}
.glyph{width:25px;height:16px;position:relative}.glyph:before,.glyph:after{content:"";position:absolute;left:0;width:20px;height:5px;border:2px solid #fff;border-right:0;transform:skewX(-24deg)}.glyph:before{top:0}.glyph:after{left:4px;bottom:0}
.profile{width:36px;height:36px;border:1px solid #343434;border-radius:50%;display:grid;place-items:center;color:#aaa;font-size:14px}
main{padding:20px}
.hero{height:330px;border:1px solid #2a2a2a;border-radius:22px;overflow:hidden;position:relative;background:#171817}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.72) 100%)}
.hero-cta{position:absolute;z-index:2;left:18px;right:18px;bottom:17px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700}
.hero-cta i{font-style:normal;font-size:28px;transform:rotate(-45deg);line-height:1}
.intro{padding:18px 2px 0}
h1{margin:0;font-size:29px;line-height:1;font-weight:780;letter-spacing:-.04em}
.subtitle{margin-top:7px;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.stat{height:92px;border:1px solid var(--line);border-radius:18px;background:var(--s);padding:15px}
.stat strong{font-size:22px;line-height:1;font-weight:760}.stat small{display:block;margin-top:13px;color:var(--muted);font-size:11px}
.price{height:62px;margin-top:10px;border:1px solid var(--line);border-radius:17px;background:var(--s);padding:0 15px;display:flex;align-items:center;justify-content:space-between}
.price b{font-size:18px}.price span{font-size:11px;color:var(--muted)}
.booking-title{margin:28px 0 13px;font-size:26px;font-weight:760;letter-spacing:-.04em}
.booking-card{height:146px;border:1px solid #2c2c2c;border-radius:20px;background:#0b0b0b;position:relative;overflow:hidden;padding:18px}
.booking-card:after{content:"";position:absolute;width:250px;height:90px;border:2px solid var(--a);border-radius:50%;right:-42px;bottom:-56px;opacity:.72}
.booking-card strong{font-size:17px}.booking-card small{display:block;color:var(--muted);font-size:11px;margin-top:6px}.book{position:absolute;left:18px;bottom:17px;font-size:13px;font-weight:700}.ai{position:absolute;right:14px;bottom:48px;width:42px;height:42px;border-radius:50%;border:1px solid #353535;background:#070707;color:var(--a);display:grid;place-items:center;font-size:18px}
.nav{position:absolute;left:0;right:0;bottom:0;height:76px;border-top:1px solid #171717;background:#050505;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;text-align:center;font-size:10px;color:#6d6d6d}
.nav div:before{display:block;font-size:20px;margin-bottom:4px}.nav .h:before{content:"⌂"}.nav .u:before{content:"▦"}.nav .r:before{content:"▣"}.nav .on{color:#fff}
</style>
</head>
<body>
<div class="phone">
  <header class="appbar"><div class="brand"><span class="glyph"></span>ГЛАВМОС</div><div class="profile">○</div></header>
  <main>
    <section class="hero">
      <img src="./hero.svg" alt="">
      <div class="hero-cta"><span>Записаться</span><i>→</i></div>
    </section>
    <section class="intro">
      <h1>ГЛАВМОС</h1>
      <div class="subtitle">Детейлинг · Москва</div>
    </section>
    <div class="stats">
      <div class="stat"><strong>4</strong><small>услуги в приложении</small></div>
      <div class="stat"><strong>Москва</strong><small>Ташкентская, 28</small></div>
    </div>
    <div class="price"><b>от 1 500 ₽</b><span>по публичному прайсу</span></div>
    <div class="booking-title">Запись в студию</div>
    <section class="booking-card">
      <strong>Свежий вид для вашего авто</strong>
      <small>Услуга и удобное время</small>
      <div class="book">Записаться</div>
      <div class="ai">✦</div>
    </section>
  </main>
  <nav class="nav"><div class="h on">Главная</div><div class="u">Услуги</div><div class="r">Моя запись</div></nav>
</div>
</body>
</html>
