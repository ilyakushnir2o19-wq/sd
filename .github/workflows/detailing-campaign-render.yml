name: Bespoke Detailing Pitch Renders

on:
  push:
    paths:
      - "apps/web/public/pitches/**"
      - ".github/workflows/detailing-campaign-render.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate ten bespoke screens
        shell: bash
        run: |
          for SLUG in glavmos proservice tunec easy studio1798 srv decar citylab tiptop okley
          do
            test -f "apps/web/public/pitches/$SLUG/index.html"
            grep -q "private demo" "apps/web/public/pitches/$SLUG/index.html"
          done

      - name: Render ten mobile screenshots
        shell: bash
        run: |
          mkdir -p /tmp/detailing-bespoke
          python -m http.server 8765 >/tmp/pitch-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"

          for SLUG in glavmos proservice tunec easy studio1798 srv decar citylab tiptop okley
          do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6000               --window-size=390,844               --screenshot="/tmp/detailing-bespoke/$SLUG.png"               "http://127.0.0.1:8765/apps/web/public/pitches/$SLUG/"
            test "$(stat -c%s "/tmp/detailing-bespoke/$SLUG.png")" -gt 15000
          done

      - uses: actions/upload-artifact@v4
        with:
          name: detailing-10-bespoke-pitches
          path: /tmp/detailing-bespoke/*.png
