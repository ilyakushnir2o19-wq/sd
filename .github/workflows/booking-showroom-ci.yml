name: Booking Showroom CI

on:
  push:
    paths:
      - "apps/web/public/showroom/**"
      - "scripts/showroom_tenant.py"
      - "tests/test_showroom_tenant.py"
      - ".github/workflows/booking-showroom-ci.yml"
  pull_request:
    paths:
      - "apps/web/public/showroom/**"
      - "scripts/showroom_tenant.py"
      - "tests/test_showroom_tenant.py"
      - ".github/workflows/booking-showroom-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate tenant generator
        run: |
          python -m compileall -q scripts/showroom_tenant.py
          python scripts/showroom_tenant.py \
            --company "Demo Auto" \
            --slug demo-ci \
            --city "Москва" \
            --gallery "https://example.com/work.jpg|BMW X5|полировка" \
            --service "Диагностика|45 мин|1800|ходовая|https://example.com/service.jpg" \
            --output /tmp/demo-ci.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/demo-ci.json"))
          assert data["slug"] == "demo-ci"
          assert data["services"][0]["price"] == 1800
          assert data["gallery"][0]["title"] == "BMW X5"
          assert data["nearestSlot"]
          print("tenant generator ok")
          PY

      - name: Validate showroom assets
        run: |
          node --check apps/web/public/showroom/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("apps/web/public/showroom")
          assert (root/"index.html").exists()
          assert (root/"app.css").exists()
          assert (root/"assets/automotive-fallback.svg").exists()
          for path in (root/"tenants").glob("*.json"):
              data=json.loads(path.read_text())
              for key in ("slug","name","accent","hero","services"):
                  assert data.get(key), f"{path}: missing {key}"
              assert len(data["services"]) >= 2, f"{path}: needs >=2 services"
          print("showroom assets ok")
          PY

      - name: Render premium mobile previews
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/showroom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --window-size=430,932 \
            --screenshot=/tmp/graphite.png \
            "http://127.0.0.1:8765/apps/web/public/showroom/?tenant=graphite"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --window-size=430,932 \
            --screenshot=/tmp/voltage.png \
            "http://127.0.0.1:8765/apps/web/public/showroom/?tenant=voltage"

          test "$(stat -c%s /tmp/graphite.png)" -gt 20000
          test "$(stat -c%s /tmp/voltage.png)" -gt 20000
          file /tmp/graphite.png | grep -q "PNG image data"
          file /tmp/voltage.png | grep -q "PNG image data"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-showroom-screens
          path: |
            /tmp/graphite.png
            /tmp/voltage.png
