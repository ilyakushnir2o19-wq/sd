name: Bootstrap OpenGTM mirror

on:
  push:
    paths:
      - ".github/workflows/bootstrap-opengtm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch OpenGTM upstream
        run: |
          git clone --depth 1 https://github.com/debpalash/OpenGTM.git "$RUNNER_TEMP/opengtm"

      - name: Python smoke tests
        working-directory: ${{ runner.temp }}/opengtm
        run: |
          python -m pip install --upgrade uv
          uv sync --dev
          uv run python -m compileall -q apps
          uv run pytest -q

      - name: Frontend build
        working-directory: ${{ runner.temp }}/opengtm
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install --frozen-lockfile
          bun run build

      - name: Validate Docker Compose
        working-directory: ${{ runner.temp }}/opengtm
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Mirror verified upstream into this repository
        run: |
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/workflows/" \
            "$RUNNER_TEMP/opengtm/" ./
          rm -f .env
          git config user.name "OpenGTM Mirror Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already up to date."
            exit 0
          fi
          git commit -m "chore: mirror verified OpenGTM upstream"
          git push origin HEAD:main
