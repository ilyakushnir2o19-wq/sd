name: Full Verification

on:
  push:
    paths:
      - ".github/workflows/full-verification.yml"
      - "apps/api/services/crm/attio.py"
      - "apps/api/services/workbook/output.py"
      - "apps/api/routers/settings.py"
      - "apps/api/services/queue_service.py"
      - "apps/api/services/templates/recipes/manual-ops-arbitrage.yaml"
      - "tests/test_attio_crm.py"
      - "tests/test_template_gallery.py"
      - "tests/test_queue_load.py"
      - ".env.example"
      - "apps/docs/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Python full suite
        run: |
          python -m pip install --upgrade uv
          uv sync --dev
          uv run python -m compileall -q apps
          uv run pytest -q

      - name: Frontend build
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install --frozen-lockfile
          bun run build

      - name: Docker Compose config
        run: |
          cp .env.example .env
          docker compose config -q
